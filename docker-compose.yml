version: '3.8'

services:
  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5454:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    # command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"
    command: /bin/sh -c "bundle exec rails db:setup"
    volumes:
      - .:/app
      - bundle:/.bundle
    ports:
      - "3000:3000"
    depends_on:
      - db
    tty: true
    stdin_open: true
    environment:
      - PORT=3000
      - RAILS_ENV=development
      - DATABASE_PORT=5454
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db

volumes:
  postgres_data:
  bundle:
